<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OP-Rogue</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Pirata+One&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--panel:rgba(32,18,8,.9);--ink:#f7ecd2;--dim:#c9b48a;--gold:#f2b632;--red:#d9472b;--ok:#7be0a0;--line:#1a0f08;
--font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--font-title:"Pirata One",Georgia,serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:#0b4a73;color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
main{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px 16px}
.wrap{width:100%;max-width:520px}
h1{font-family:var(--font-title);font-weight:400;font-size:clamp(56px,14vw,96px);letter-spacing:3px;color:var(--gold);text-align:center;margin:0 0 4px;line-height:1;
 text-shadow:0 4px 0 var(--line),3px 0 0 var(--line),-3px 0 0 var(--line),0 -3px 0 var(--line),0 8px 18px rgba(0,0,0,.5)}
.sub{text-align:center;color:#fff;font-size:17px;margin-bottom:18px;text-shadow:0 2px 0 var(--line),0 0 10px rgba(0,0,0,.6)}
.box{background:var(--panel);border:4px solid var(--gold);border-radius:6px;box-shadow:0 0 0 4px var(--line),0 10px 28px rgba(0,0,0,.5);padding:22px}
.screen{display:none}.screen.on{display:block}
h2{font-weight:600;font-size:26px;margin:0 0 12px;color:var(--gold)}
.big{font-size:24px;font-weight:600;text-align:center;margin:6px 0 16px}
input[type=text]{width:100%;font-family:var(--font);font-size:18px;padding:10px 12px;background:var(--line);color:var(--ink);border:3px solid var(--dim);border-radius:4px;outline:none;margin:10px 0}
input[type=text]:focus{border-color:var(--gold)}
button{font-family:var(--font);font-size:18px;font-weight:600;color:var(--line);background:linear-gradient(#ffd45e,#e0a21d);border:3px solid var(--line);border-radius:4px;padding:8px 18px;cursor:pointer;box-shadow:0 4px 0 #7a5208}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #7a5208}
button:disabled{background:#6b6258;box-shadow:none;cursor:not-allowed;color:#2a241d}
button.ghost{background:transparent;color:var(--dim);border-color:var(--dim);box-shadow:none}
button.danger{background:linear-gradient(#f0694e,#c0381f);color:#fff;box-shadow:0 4px 0 #6d1d0d}
.menu button{display:block;width:100%;margin:12px 0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center}
.msg{min-height:1.6em;font-size:15px}.err{color:#ff8a72}.ok{color:var(--ok)}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0}
input[type=range]{accent-color:var(--gold);width:160px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:12px 0}
.card{background:var(--line);border:3px solid var(--dim);border-radius:4px;padding:10px;font-size:15px;line-height:1.35}
.card h3{font-weight:600;font-size:18px;margin:0 0 4px;color:var(--gold)}
.card.lock{opacity:.5}.move{color:var(--ok)}
.dim{color:var(--dim);font-size:15px}
.sprite{display:block;width:112px;height:152px;margin:0 auto 8px;image-rendering:pixelated;background:rgba(255,255,255,.07);border-radius:4px}
.card.char{text-align:center}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<main><div class="wrap">
<h1>OP-Rogue</h1>
<div class="sub">Ein Piraten-Roguelike</div>

<section id="s-welcome" class="screen on box">
  <div class="big">Willkommen auf der Grandline!</div>
  <div class="row"><button id="btn-start">Weiter ▶</button></div>
</section>

<section id="s-name" class="screen box">
  <div>Wie lautet dein Name, Pirat?</div>
  <input type="text" id="name" maxlength="16" placeholder="Dein Piratenname" autocomplete="off" spellcheck="false">
  <div class="dim">3–16 Zeichen: Buchstaben, Zahlen, _ und -</div>
  <div class="msg" id="name-msg"></div>
  <div class="row"><button id="btn-name">Bestätigen</button></div>
</section>

<section id="s-menu" class="screen box">
  <div class="big" id="menu-title"></div>
  <div class="menu">
    <button data-go="new">⚔ Neues Spiel</button>
    <button data-go="load">📜 Spiel laden</button>
    <button data-go="settings">⚙ Einstellungen</button>
    <button data-go="collection">📖 Sammlung</button>
  </div>
</section>

<section id="s-new" class="screen box">
  <h2>Neues Spiel</h2>
  <p>Hier entsteht die Teamwahl und der Start deines ersten Runs.</p>
  <button class="ghost" data-go="menu">◀ Zurück</button>
</section>

<section id="s-load" class="screen box">
  <h2>Spiel laden</h2>
  <p id="load-text"></p>
  <button class="ghost" data-go="menu">◀ Zurück</button>
</section>

<section id="s-settings" class="screen box">
  <h2>Einstellungen</h2>
  <div class="set"><span>Lautstärke</span><input type="range" id="vol" min="0" max="10" step="1"></div>
  <div class="menu">
    <button id="btn-rename">Namen ändern</button>
    <button id="btn-reset" class="danger">Spielstand löschen</button>
    <button class="ghost" data-go="menu">◀ Zurück</button>
  </div>
</section>

<section id="s-collection" class="screen box">
  <h2>Sammlung</h2>
  <div class="grid" id="col-grid"></div>
  <button class="ghost" data-go="menu">◀ Zurück</button>
</section>
</div></main>

<script>
/* ===== Hintergrund: statisches Bild (Anime-/Comic-Look, kein Animationsloop) ===== */
const cv=document.getElementById("bg"),cx=cv.getContext("2d");
const OUT="#1a0f08";
function rng(seed){return()=>(seed=(seed*16807)%2147483647)/2147483647}

function cloud(x,y,s){
  const pf=[[0,0,1],[.95,.12,.8],[1.8,.05,.62],[-.9,.15,.72],[-1.6,.2,.55],[.35,-.5,.7],[1.2,-.38,.5]];
  cx.fillStyle=OUT;
  pf.forEach(([dx,dy,r])=>{cx.beginPath();cx.arc(x+dx*s,y+dy*s,r*s+3,0,7);cx.fill()});
  cx.fillStyle="#fff";
  pf.forEach(([dx,dy,r])=>{cx.beginPath();cx.arc(x+dx*s,y+dy*s,r*s,0,7);cx.fill()});
  cx.fillStyle="#bfe3f7"; // Cel-Schatten unten
  pf.forEach(([dx,dy,r])=>{cx.beginPath();cx.arc(x+dx*s,y+dy*s+r*s*.45,r*s*.62,0,Math.PI);cx.fill()});
}

function drawScene(){
  const dpr=Math.min(devicePixelRatio||1,2),W=innerWidth,H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  const hz=H*.40,m=Math.min(W,H);

  // Himmel
  let g=cx.createLinearGradient(0,0,0,hz);
  g.addColorStop(0,"#1f7fd0");g.addColorStop(.6,"#5fc4ee");g.addColorStop(1,"#d3f3ff");
  cx.fillStyle=g;cx.fillRect(0,0,W,hz+2);
  // Sonne mit Schein
  const sx=W*.74,sy=hz*.5;
  g=cx.createRadialGradient(sx,sy,2,sx,sy,m*.3);
  g.addColorStop(0,"rgba(255,248,200,.9)");g.addColorStop(1,"rgba(255,248,200,0)");
  cx.fillStyle=g;cx.beginPath();cx.arc(sx,sy,m*.3,0,7);cx.fill();
  cx.fillStyle=OUT;cx.beginPath();cx.arc(sx,sy,m*.058,0,7);cx.fill();
  cx.fillStyle="#fff6c8";cx.beginPath();cx.arc(sx,sy,m*.052,0,7);cx.fill();
  // Wolken
  cloud(W*.16,hz*.34,m*.05);cloud(W*.52,hz*.2,m*.038);cloud(W*.9,hz*.62,m*.034);cloud(W*.34,hz*.74,m*.026);

  // Meer
  g=cx.createLinearGradient(0,hz,0,H);
  g.addColorStop(0,"#36b6dc");g.addColorStop(.35,"#1c8cc2");g.addColorStop(1,"#0a4f82");
  cx.fillStyle=g;cx.fillRect(0,hz,W,H-hz);
  cx.fillStyle="rgba(255,255,255,.55)";cx.fillRect(0,hz,W,2); // Horizontlinie
  // Wellenstriche (perspektivisch größer nach vorn)
  const r=rng(42);cx.lineCap="round";
  for(let k=1;k<=26;k++){
    const t=Math.pow(k/26,1.9),y=hz+(H-hz)*t*.82+4,len=6+t*70,lw=1+t*4;
    for(let i=0;i<Math.ceil(W/(40+t*160));i++){
      const x=r()*W;
      cx.strokeStyle=`rgba(255,255,255,${.25+t*.35})`;cx.lineWidth=lw;
      cx.beginPath();cx.moveTo(x,y);cx.quadraticCurveTo(x+len/2,y-len*.2,x+len,y);cx.stroke();
    }
  }

  // ===== Holzdeck: Blick über den spitzen Bug =====
  const tipX=W/2,tipY=H*.52,tw=W*.012,span=W*.64,N=8;
  const yAt=t=>tipY+(H-tipY)*t, hwAt=t=>tw+(span-tw)*t;
  const xp=(i,t)=>tipX+(i/N)*hwAt(t);
  // Plankenflächen
  const tones=["#cf9a58","#c18a49","#d6a362"];
  for(let i=-N;i<N;i++){
    g=cx.createLinearGradient(0,tipY,0,H);
    g.addColorStop(0,tones[(i+N)%3]);g.addColorStop(1,"#8c5a2a");
    cx.fillStyle=g;cx.beginPath();
    cx.moveTo(xp(i,0),tipY);cx.lineTo(xp(i+1,0),tipY);cx.lineTo(xp(i+1,1),H);cx.lineTo(xp(i,1),H);cx.closePath();cx.fill();
  }
  // Längsfugen + versetzte Querfugen
  cx.strokeStyle="rgba(40,20,6,.75)";
  for(let i=-N;i<=N;i++){cx.lineWidth=2;cx.beginPath();cx.moveTo(xp(i,0),tipY);cx.lineTo(xp(i,1),H);cx.stroke()}
  for(let k=1;k<=16;k++){
    const t=Math.pow(k/16,1.7),y=yAt(t);cx.lineWidth=1+t*2.5;
    for(let i=-N;i<N;i++){
      if((k+i+N)%2)continue;
      cx.beginPath();cx.moveTo(xp(i,t),y);cx.lineTo(xp(i+1,t),y);cx.stroke();
    }
  }
  // Holzmaserung & Nägel
  const r2=rng(7);cx.fillStyle="rgba(60,30,8,.45)";
  for(let n=0;n<160;n++){const t=Math.pow(r2(),1.3),y=yAt(t),i=Math.floor(r2()*2*N)-N,
    x=xp(i,t)+(xp(i+1,t)-xp(i,t))*(.2+r2()*.4);cx.fillRect(x,y,(xp(i+1,t)-xp(i,t))*.25,1+t*1.5)}
  // Deck-Umriss
  cx.strokeStyle=OUT;cx.lineWidth=4;cx.lineJoin="round";
  cx.beginPath();cx.moveTo(tipX-tw,tipY);cx.lineTo(tipX+tw,tipY);cx.lineTo(tipX+span,H);cx.lineTo(tipX-span,H);cx.closePath();cx.stroke();

  // Reling links und rechts
  const railH=t=>H*.018+t*H*.11, capH=t=>2+t*H*.025;
  [-1,1].forEach(s=>{
    const ex=t=>tipX+s*hwAt(t), steps=40;
    // Innenwand
    g=cx.createLinearGradient(0,tipY,0,H);g.addColorStop(0,"#8a5a2b");g.addColorStop(1,"#5b3416");
    cx.fillStyle=g;cx.beginPath();cx.moveTo(ex(0),yAt(0));
    for(let j=0;j<=steps;j++){const t=j/steps;cx.lineTo(ex(t),yAt(t))}
    for(let j=steps;j>=0;j--){const t=j/steps;cx.lineTo(ex(t),yAt(t)-railH(t))}
    cx.closePath();cx.fill();cx.strokeStyle=OUT;cx.lineWidth=3;cx.stroke();
    // Handlauf
    cx.fillStyle="#c8914c";cx.beginPath();cx.moveTo(ex(0),yAt(0)-railH(0));
    for(let j=0;j<=steps;j++){const t=j/steps;cx.lineTo(ex(t),yAt(t)-railH(t))}
    for(let j=steps;j>=0;j--){const t=j/steps;cx.lineTo(ex(t),yAt(t)-railH(t)-capH(t))}
    cx.closePath();cx.fill();cx.stroke();
    // Pfosten + Tau
    const ts=[.1,.22,.37,.55,.78],pts=[];
    ts.forEach(t=>{
      const x=ex(t),y=yAt(t)-railH(t),ph=H*.035+t*H*.17,pw=3+t*12;
      cx.fillStyle="#6e4421";cx.fillRect(x-pw/2,y-ph,pw,ph);cx.strokeStyle=OUT;cx.lineWidth=2;cx.strokeRect(x-pw/2,y-ph,pw,ph);
      cx.fillStyle="#e3b46c";cx.beginPath();cx.arc(x,y-ph,pw*.65,0,7);cx.fill();cx.stroke();
      pts.push([x,y-ph*.82]);
    });
    pts.unshift([ex(0),yAt(0)-H*.03]);
    cx.strokeStyle="#e8cf98";cx.lineWidth=3;cx.beginPath();cx.moveTo(...pts[0]);
    for(let j=1;j<pts.length;j++){const [a,b]=pts[j-1],[c,d]=pts[j];cx.quadraticCurveTo((a+c)/2,Math.max(b,d)+8+j*2,c,d)}
    cx.stroke();
  });

  // Bugspriet: ragt vorn über den Bug aufs Meer hinaus
  const bx=tipX,by=tipY-H*.012,ey=hz-H*.07;
  cx.fillStyle="#7a4b23";cx.beginPath();cx.moveTo(bx-tw*1.8,by);cx.lineTo(bx+tw*1.8,by);cx.lineTo(bx+2,ey);cx.lineTo(bx-2,ey);cx.closePath();cx.fill();
  cx.strokeStyle=OUT;cx.lineWidth=2.5;cx.stroke();
  cx.fillStyle="#e3b46c";cx.beginPath();cx.arc(bx,by,tw*2.2,0,7);cx.fill();cx.stroke(); // Bugkappe
  // Vorstag-Taue
  cx.strokeStyle="rgba(232,207,152,.9)";cx.lineWidth=2;
  [[-1],[1]].forEach(([s])=>{cx.beginPath();cx.moveTo(bx,ey);cx.lineTo(tipX+s*hwAt(.1),yAt(.1)-railH(.1)-H*.06);cx.stroke()});

  // Vignette
  g=cx.createRadialGradient(W/2,H*.55,m*.45,W/2,H*.55,Math.max(W,H)*.85);
  g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,"rgba(8,20,40,.5)");
  cx.fillStyle=g;cx.fillRect(0,0,W,H);
}
addEventListener("resize",drawScene);drawScene();

/* ===== Daten & Speicherstand ===== */
const PIRATES=[
 {id:"ruffy",name:"Strohhut Ruffy",tag:"Teufelsfruchtnutzer",move:"Gum-Gum-Pistole"},
 {id:"zorro",name:"Roronoa Zorro",tag:"Schwertkämpfer",move:"Oni Giri"},
 {id:"sanji",name:"Schwarzfuß Sanji",tag:"Kämpfer",move:"Diable Jambe"}
];
const $=id=>document.getElementById(id);
let save={name:null,run:null,unlocked:PIRATES.map(p=>p.id),vol:5},db=null,uid=null;
try{Object.assign(save,JSON.parse(localStorage.getItem("oprg_save")||"{}"))}catch(e){}
const persist=()=>{try{localStorage.setItem("oprg_save",JSON.stringify(save))}catch(e){}};

function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id))}
function openMenu(){$("menu-title").textContent="Leg los, "+save.name;show("s-menu")}
function openName(){$("name").value=save.name||"";$("name-msg").textContent="";show("s-name");$("name").focus()}

/* ===== Anmeldung ===== */
$("btn-start").onclick=()=>save.name?openMenu():openName();
async function claim(){
  const raw=$("name").value.trim(),msg=$("name-msg");msg.className="msg";
  if(!/^[A-Za-z0-9_-]{3,16}$/.test(raw)){msg.classList.add("err");msg.textContent="Ungültiger Name. Nutze 3–16 Zeichen: Buchstaben, Zahlen, _ oder -.";return}
  $("btn-name").disabled=true;msg.textContent="Prüfe Verfügbarkeit …";
  try{
    // Die Datenbank gibt es nur auf der veröffentlichten Claude-Seite.
    // Als eigene Datei läuft die Anmeldung rein lokal (ohne Verfügbarkeitsprüfung).
    if(!db&&typeof claude!=="undefined")db=await claude.use("db");
    try{if(typeof claude!=="undefined"){const u=await claude.use("user");uid=u?await u.id():null}}catch(e){}
    if(db){
      const ref=db.doc("usernames/"+raw.toLowerCase()),snap=await ref.get();
      if(snap.exists&&snap.data().uid!==uid){msg.className="msg err";msg.textContent="Dieser Name ist leider schon vergeben. Bitte wähle einen anderen!";$("btn-name").disabled=false;$("name").select();return}
      await ref.set({name:raw,uid:uid||null,created:Date.now()});
    }
  }catch(e){msg.className="msg err";msg.textContent="Speichern in der Datenbank nicht möglich (fehlende Schreibrechte?).";$("btn-name").disabled=false;return}
  save.name=raw;persist();$("btn-name").disabled=false;openMenu();
}
$("btn-name").onclick=claim;
$("name").addEventListener("keydown",e=>{if(e.key==="Enter")claim()});

/* ===== Navigation ===== */
function go(t){
  if(t==="menu")return openMenu();
  if(t==="load"){$("load-text").textContent=save.run?"Gespeicherter Run gefunden.":"Noch kein Spielstand vorhanden.";}
  if(t==="settings")$("vol").value=save.vol;
  if(t==="collection"){renderCollection();startIdle()}
  show("s-"+t);
}
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
$("vol").oninput=e=>{save.vol=+e.target.value;persist()};
$("btn-rename").onclick=openName;
$("btn-reset").onclick=()=>{if(confirm("Wirklich alles löschen?")){try{localStorage.removeItem("oprg_save")}catch(e){}location.reload()}};

/* ===== Pixel-Charaktere: runder Pixel-Stil mit Kontur, Licht (oben/links) und Schatten (unten/rechts) ===== */
const SW=28,SH=38,OUTC="#1a0f08",CHARS={};
const px=(g,x,y,c)=>{x+=2;y+=2;if(x>=0&&y>=0&&x<SW&&y<SH)g[y*SW+x]=c};
const rc=(g,x,y,w,h,c)=>{for(let j=0;j<h;j++)for(let i=0;i<w;i++)px(g,x+i,y+j,c)};
// abgerundetes Rechteck; s=[Basis,Licht,Schatten]
function rr(g,x,y,w,h,s){
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){
    if(w>2&&h>2&&(i==0||i==w-1)&&(j==0||j==h-1))continue;
    px(g,x+i,y+j,(j==h-1||i==w-1)?s[2]:(j==0||i==0)?s[1]:s[0]);
  }
}
function ln(g,x0,y0,x1,y1,c){
  const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;
  for(;;){px(g,x0,y0,c);if(x0==x1&&y0==y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}
}
// pose: d = Körper/Kopf nach unten (Atmen), al/ar = linker/rechter Arm nach unten
function drawChar(cv,id,pose){
  pose=pose||{};const g=new Array(SW*SH).fill(null);
  CHARS[id](g,{d:pose.d||0,al:pose.al||0,ar:pose.ar||0});
  cv.width=SW;cv.height=SH;const c=cv.getContext("2d");
  const at=(x,y)=>x<0||y<0||x>=SW||y>=SH?null:g[y*SW+x];
  for(let y=0;y<SH;y++)for(let x=0;x<SW;x++){
    const v=at(x,y);
    if(v){c.fillStyle=v;c.fillRect(x,y,1,1)}
    else if(at(x-1,y)||at(x+1,y)||at(x,y-1)||at(x,y+1)){c.fillStyle=OUTC;c.fillRect(x,y,1,1)}
  }
}

CHARS.ruffy=(g,p)=>{const d=p.d,
  skin=["#f2c08f","#ffd9b0","#c98f63"],hair=["#2b2b36","#4b4b5c","#15151c"],
  straw=["#efcb55","#ffe68e","#c19a2b"],red=["#dd3a2c","#ff6c58","#a42318"],
  blue=["#3b64c4","#5f8be6","#26418a"],sand=["#8b5a2b","#b07a45","#5d3a18"];
  rr(g,8,28,3,4,skin);rr(g,13,28,3,4,skin);rr(g,7,32,5,2,sand);rr(g,12,32,5,2,sand);
  rr(g,7,24,10,4,blue);
  rr(g,4,16+d+p.al,3,7,skin);rr(g,17,16+d+p.ar,3,7,skin);
  rr(g,7,16+d,3,8,red);rr(g,14,16+d,3,8,red);
  rc(g,10,16+d,4,7,skin[0]);rc(g,10,16+d,1,7,skin[1]);rc(g,13,16+d,1,7,skin[2]);
  [[10,18],[13,18],[11,19],[12,19],[10,20],[13,20]].forEach(([x,y])=>px(g,x,y+d,"#a8483a")); // X-Narbe
  rc(g,7,23+d,10,1,"#f0c548"); // gelbe Schärpe
  rr(g,6,5+d,12,11,skin);rc(g,5,10+d,1,2,skin[2]);rc(g,18,10+d,1,2,skin[2]);
  rc(g,6,6+d,1,4,hair[0]);rc(g,17,6+d,1,4,hair[0]);rc(g,7,6+d,10,2,hair[0]);

// Leerlauf-Animation (Atmen + gegengleiche Arme), läuft nur, solange die Sammlung offen ist
let idleOn=false;
function startIdle(){if(!idleOn){idleOn=true;requestAnimationFrame(idle)}}
function idle(ts){
  if(!$("s-collection").classList.contains("on")){idleOn=false;return}
  const d=Math.sin(ts/1000*3)>0?1:0;
  document.querySelectorAll("canvas.sprite").forEach(cv=>{
    const k=cv.dataset.id+d;if(cv._k===k)return;cv._k=k;
    drawChar(cv,cv.dataset.id,{d:d,al:d,ar:1-d});
  });
  requestAnimationFrame(idle);
}

function renderCollection(){
  const g=$("col-grid");g.innerHTML="";
  CHAR_INFO.forEach(p=>{
    const d=document.createElement("div");
    if(save.unlocked.includes(p.id)){
      d.className="card char";
      d.innerHTML='<canvas class="sprite" data-id="'+p.id+'"></canvas><h3></h3><div class="dim"></div><div class="move"></div>';
      d.querySelector("h3").textContent=p.name;d.querySelector(".dim").textContent=p.tag;d.querySelector(".move").textContent=p.move;
    }else{d.className="card lock";d.innerHTML="<h3>???</h3>Noch nicht rekrutiert"}
    g.appendChild(d);
  });
  for(let i=0;i<3;i++){const d=document.createElement("div");d.className="card lock";d.innerHTML="<h3>???</h3>Noch nicht rekrutiert";g.appendChild(d)}
}
