<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mittelalter-Roguelike</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
/* --u = Größe eines Pixels auf dem Bildschirm (wird per JS gesetzt), --us = Pixelgröße des Wegweisers */
:root{color-scheme:dark;--u:4px;--us:4px;--ink:#f1e6cf;--font:"Pixelify Sans",ui-monospace,monospace;
 --fw:min(64vw,calc(80vh*16/9));--ar:16/9;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f1e6cf}}
:root[data-theme="dark"]{--ink:#f1e6cf}
@media (max-width:760px){:root{--fw:94vw;--ar:4/3}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:#4a8d3c;color:var(--ink);font-family:var(--font)}
#bg{position:fixed;left:0;top:0;image-rendering:pixelated}

/* ===== Spielfenster (mittig, Pixel-Rahmen aus Stein) ===== */
.game{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:var(--fw);aspect-ratio:var(--ar);
 background:#1d1812;border-radius:0;
 box-shadow:inset 0 0 0 var(--u) #14100b,inset 0 0 0 calc(var(--u)*3) #9a8a72,inset 0 0 0 calc(var(--u)*4) #5f5240,inset 0 0 0 calc(var(--u)*5) #14100b,
  0 0 0 var(--u) #14100b,calc(var(--u)*2) calc(var(--u)*2) 0 var(--u) rgba(0,0,0,.35);
 display:grid;place-items:center;text-align:center}
.game h1{font-weight:700;font-size:calc(var(--u)*8);margin:0 0 var(--u);color:#f0c85a;text-shadow:var(--u) var(--u) 0 #000;line-height:1.1}
.game p{margin:0;color:#c4b394;font-size:calc(var(--u)*4);font-weight:500}

/* ===== Wegweiser (neben dem Fenster, rechts unten) ===== */
.side{position:fixed;right:0;bottom:0;width:calc((100vw - var(--fw))/2);display:flex;justify-content:center;align-items:flex-end;
 padding-bottom:4vh;pointer-events:none}
@media (max-width:760px){.side{width:100vw;justify-content:flex-end;padding:0 4vw 3vh 0}}
.sign{position:relative;width:calc(var(--us)*52);height:calc(var(--us)*58)}
.sign canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.signtxt{position:absolute;left:calc(var(--us)*13);top:calc(var(--us)*2);width:calc(var(--us)*32);height:calc(var(--us)*20);
 display:flex;align-items:center;justify-content:center;text-align:center;
 font-weight:700;font-size:calc(var(--us)*5.2);line-height:1.1;color:#2a1a0c;text-shadow:0 calc(var(--us)*.5) 0 rgba(255,225,170,.45)}
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div class="game" id="game">
  <div><h1>Spielfenster</h1><p>Hier entsteht das Menü</p></div>
</div>

<div class="side"><div class="sign">
  <canvas id="signcv"></canvas>
  <div class="signtxt">Auf in die<br>Schlacht</div>
</div></div>

<script>
/* ===== Pixel-Helfer: alles wird in niedriger Auflösung gezeichnet und per CSS vergrößert ===== */
const cv=document.getElementById("bg"),M=cv.getContext("2d");
const OUT="#1a1f16",HAZE="#dcefc8";
const hexRGB=c=>[1,3,5].map(i=>parseInt(c.substr(i,2),16));
const mixHex=(a,b,k)=>{const A=hexRGB(a),B=hexRGB(b);return"#"+A.map((v,i)=>Math.round(v+(B[i]-v)*k).toString(16).padStart(2,"0")).join("")};
const rng=s=>()=>(s=(s*16807)%2147483647)/2147483647;
const hs=(x,y)=>{let h=Math.imul(x|0,73856093)^Math.imul(y|0,19349663);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)%1000/1000};
const px=(c,x,y,col)=>{c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),1,1)};
const rect=(c,x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))};
function disc(c,x,y,rx,ry,col,dith){x=Math.round(x);y=Math.round(y);ry=Math.max(ry,.5);
  for(let dy=-Math.round(ry);dy<=Math.round(ry);dy++){const half=Math.round(rx*Math.sqrt(Math.max(0,1-dy*dy/(ry*ry+.01))));
    for(let dx=-half;dx<=half;dx++)if(!dith||((x+dx+y+dy)&1)==0)px(c,x+dx,y+dy,col)}}
// dunkle Kontur um alle gefüllten Pixel (wie beim Baum-Vorbild)
function outline(c,w,h,col){const d=c.getImageData(0,0,w,h),a=d.data,o=new Uint8ClampedArray(a),[r,g,b]=hexRGB(col);
  const op=(x,y)=>x>=0&&y>=0&&x<w&&y<h&&a[(y*w+x)*4+3]>0;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;
    if(a[i+3]===0&&(op(x-1,y)||op(x+1,y)||op(x,y-1)||op(x,y+1))){o[i]=r;o[i+1]=g;o[i+2]=b;o[i+3]=255}}
  d.data.set(o);c.putImageData(d,0,0)}
function sprite(ox,oy,w,h,draw,oc){ox=Math.round(ox);oy=Math.round(oy);w=Math.max(3,Math.ceil(w));h=Math.max(3,Math.ceil(h));
  const t=document.createElement("canvas");t.width=w;t.height=h;const c=t.getContext("2d",{willReadFrequently:true});
  c.translate(-ox,-oy);draw(c);c.setTransform(1,0,0,1,0,0);outline(c,w,h,oc||OUT);M.drawImage(t,ox,oy)}
// Farbverlauf in Stufen mit Raster-Dithering (typisch Pixelart)
const BAY=[[0,.5],[.75,.25]];
const band=(pal,f,x,y)=>{const v=Math.max(0,Math.min(1,f))*(pal.length-1),i=Math.min(pal.length-2,Math.floor(v));return pal[i+(v-i>BAY[y&1][x&1]?1:0)]};
// Kugel/Blatthaufen mit 4 Farbtönen: Licht von oben links
function blob(c,ds,pal,seed){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  ds.forEach(([x,y,rx,ry])=>{x0=Math.min(x0,x-rx);x1=Math.max(x1,x+rx);y0=Math.min(y0,y-ry);y1=Math.max(y1,y+ry)});
  for(let y=Math.floor(y0);y<=Math.ceil(y1);y++)for(let x=Math.floor(x0);x<=Math.ceil(x1);x++){
    let hit=null;for(const d of ds){const nx=(x-d[0])/(d[2]+.4),ny=(y-d[1])/(d[3]+.4);if(Math.pow(Math.abs(nx),3)+Math.pow(Math.abs(ny),3)<=1)hit=[nx,ny]}
    if(!hit)continue;
    const l=-(hit[0]*.5+hit[1]*.85)+((x+y)&1?.06:-.06)+(hs(x+seed,y)<.12?.22:0);
    px(c,x,y,l>.5?pal[3]:l>.12?pal[2]:l>-.35?pal[1]:pal[0])}}
const GREEN=[["#235d2f","#35903b","#5cb949","#92d65c"],["#285a2c","#3f8a35","#6bb046","#a4da60"]];
const TRUNK=["#3f2512","#6e4224","#a0653a","#d6a068"];
function trunk(c,x,by,th,tw,pal,seed,bend){
  for(let i=0;i<=th;i++){const y=by-i,f=i/th,w=Math.max(2,Math.round(tw*(1+(1-f)*.45))),off=Math.round(Math.sin(i*.09+seed)*bend*f),x0=x-Math.floor(w/2)+off;
    for(let j=0;j<w;j++){const r=j/(w-1||1);let col=r<.3?pal[2]:r<.72?pal[1]:pal[0];
      const n=hs(x0+j,y+seed);if(n<.07)col=pal[3];else if(n>.95)col=pal[0];px(c,x0+j,y,col)}}
  return Math.round(Math.sin(th*.09+seed)*bend)}

/* ===== Waldszene ===== */
let W=0,H=0,S=4;
function layout(){const vw=innerWidth,vh=innerHeight;
  S=Math.max(2,Math.round(Math.min(vh/190,vw/150)));
  const rs=document.documentElement.style;rs.setProperty("--u",S+"px");
  const fw=vw<=760?vw*.94:Math.min(vw*.64,vh*.8*16/9),margin=vw<=760?vw*.46:(vw-fw)/2-12;
  rs.setProperty("--us",Math.max(1,Math.min(S,Math.floor(margin/54)))+"px")}

function drawForest(){
  layout();W=Math.ceil(innerWidth/S);H=Math.ceil(innerHeight/S);
  cv.width=W;cv.height=H;cv.style.width=W*S+"px";cv.style.height=H*S+"px";
  const R=rng(11),vy=Math.round(H*.26),vw=innerWidth,vh=innerHeight,fwPx=vw<=760?vw*.94:Math.min(vw*.64,vh*.8*16/9),FL=(vw-fwPx)/2/S,FR=W-FL,sideMode=FL>=28;
  const Y=t=>vy+(H-vy)*t,HW=t=>W*(.01+.2*t),CX=t=>W/2+Math.sin(t*3.2+.8)*W*.025*(1-t*.5);
  const SKY=["#3d96e0","#5fb0ec","#8ac8f2","#b5dff6","#dff0fa"],GRD=["#c9e08a","#a6d06d","#82bb58","#62a447","#4a8d3c","#387632","#2b6029"];
  const SAND=["#ecdcae","#dcc58b","#cdae6f","#bd9559","#a97f45"];

  // Blätterdach/Himmel + Waldboden (gestuft, gerastert)
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)px(M,x,y,y<vy?band(SKY,y/vy,x,y):band(GRD,(y-vy)/(H-vy),x,y));
  // ferne Baumreihe am Horizont
  [["#a9d57a",.7],["#8cc866",1]].forEach(([col,s],j)=>{for(let x=-4;x<W+6;x+=2+Math.floor(R()*4)){
    disc(M,x,vy-1-j*2+Math.round(R()*2),3+R()*5*s,2+R()*3*s,col)}});
  // Pixel-Wolken
  const cloud=(x,y,s)=>{const P=[[0,0,1],[1.1,.2,.8],[-1.1,.25,.75],[.5,-.5,.7]];
    P.forEach(([a,b,q])=>disc(M,x+a*s,y+b*s*.6+Math.max(1,s*.28),q*s,q*s*.55,"#bcd9f0"));
    P.forEach(([a,b,q])=>disc(M,x+a*s,y+b*s*.6,q*s,q*s*.55,"#ffffff"))};
  [[.12,.1,7],[.34,.2,5],[.62,.08,8],[.86,.2,6],[.5,.3,4]].forEach(([a,b,sz])=>cloud(W*a,vy*b+3,Math.max(3,sz*W/360)));

  // ===== Sandweg =====
  const L=[],Rg=[];
  for(let y=vy;y<H;y++){
    const t=(y-vy)/(H-vy),c0=Math.round(CX(t)),hw=Math.max(1,Math.round(HW(t))+Math.round((hs(y,3)-.5)*1.8)),l=c0-hw,r=c0+hw;L[y]=l;Rg[y]=r;
    for(let x=l;x<=r;x++){let col=band(SAND,t,x,y);const n=hs(x,y);
      if(n<.05)col="#f0e0b4";else if(n>.95)col="#a2773f";
      if(x===l||x===r)col="#6e4a26";else if(x===r-1&&t>.15)col="#a97f45";
      px(M,x,y,col)}}
  for(let i=0;i<110;i++){const t=Math.pow(R(),.8),y=Math.round(Y(t));if(y<vy||y>=H)continue;
    const w=2+Math.floor(t*6),x=Math.round(CX(t)+(R()*2-1)*HW(t)*.8);for(let k=0;k<w;k++)if(x+k>L[y]+1&&x+k<Rg[y]-1)px(M,x+k,y,"#b48b50")}

  // Moosflecken auf dem Weg
  for(let i=0;i<55;i++){const t=Math.pow(R(),.8),y=Math.round(Y(t));if(y<vy+2||y>=H)continue;
    const x=Math.round(CX(t)+(R()*2-1)*HW(t)*.85),n=2+Math.floor(R()*4);
    for(let k=0;k<n;k++){const xx=x+Math.floor(R()*3*(.4+t*2)),yy=y+(R()<.3?1:0);if(xx>L[y]&&xx<Rg[y])px(M,xx,yy,R()<.5?"#4c9a3c":"#7fc455")}}
  // Steine als graue Punkte, teils bemoost
  const stones=[];for(let i=0,n=Math.round(110*Math.min(1,W/360)+25);i<n;i++){const t=Math.pow(R(),.75);stones.push({t,x:CX(t)+(R()*2-1)*HW(t)*.88,r:R(),m:R()<.4})}
  stones.sort((a,b)=>a.t-b.t);
  stones.forEach(s=>{
    const x=Math.round(s.x),y=Math.round(Y(s.t)),rx=1+Math.floor(s.t*2.4+s.r*.9),ry=Math.max(1,Math.round(rx*.6)),k=(1-s.t)*.5;
    if(y<vy+2||y>=H)return;
    const gp=["#4b515b","#7b818c","#a8adb6","#d2d6dc"].map(c=>mixHex(c,HAZE,k)),mp=["#2d6a30","#4c9a3c","#80c657"].map(c=>mixHex(c,HAZE,k));
    rect(M,x-rx+1,y+ry+1,rx*2-1,1,"#a07a45");
    if(rx<=1){px(M,x,y,gp[1]);px(M,x-1,y,gp[2]);if(s.m)px(M,x-1,y,mp[1]);return}
    sprite(x-rx-2,y-ry-2,rx*2+5,ry*2+5,c=>{
      for(let yy=-ry;yy<=ry;yy++)for(let xx=-rx;xx<=rx;xx++){const nx=xx/(rx+.3),ny=yy/(ry+.3);if(nx*nx+ny*ny>1)continue;
        const l=-(nx*.5+ny*.8);let col=l>.45?gp[3]:l>.05?gp[2]:l>-.4?gp[1]:gp[0];
        if(s.m&&ny<-.1+(hs(x+xx,y+yy)-.5)*.7)col=l>.2?mp[2]:l>-.3?mp[1]:mp[0];
        px(c,x+xx,y+yy,col)}},mixHex("#2a2c33",HAZE,k*.8))});

  // Gras am Wegrand + Büschel + Blümchen
  const tuft=(x,y,h,k)=>{const cs=["#2f7a35","#4aa83a","#7fcb52"].map(c=>mixHex(c,HAZE,k));
    for(let j=-1;j<=1;j++){const hh=Math.max(1,h-Math.abs(j)+(hs(x+j,y)<.4?1:0));for(let q=0;q<hh;q++)px(M,x+j,y-q,cs[(q+j+3)%3===0?2:q?1:0])}};
  for(let i=0;i<170;i++){const t=Math.pow(R(),.8),y=Math.round(Y(t));if(y<vy+2||y>=H)continue;
    const s=R()<.5?-1:1;tuft(s<0?L[y]:Rg[y],y,2+Math.floor(t*4),(1-t)*.5)}
  for(let i=0;i<420;i++){const t=Math.pow(R(),.8),x=Math.floor(R()*W),y=Math.round(Y(t));if(y<vy+2||y>=H)continue;
    if(x>L[y]-3&&x<Rg[y]+3)continue;tuft(x,y,1+Math.floor(t*3),(1-t)*.5)}
  for(let i=0;i<70;i++){const t=Math.pow(R(),.9),x=Math.floor(R()*W),y=Math.round(Y(t));if(y<vy+2||y>=H)continue;
    if(x>L[y]-3&&x<Rg[y]+3)continue;const c=R()<.6?"#ffe66d":"#ffffff";
    px(M,x,y,c);if(t>.35){px(M,x-1,y,"#fff");px(M,x+1,y,"#fff");px(M,x,y-1,"#fff");px(M,x,y,"#ffe66d")}}

  // ===== Bäume von fern nach nah =====
  const trees=[];
  [-1,1].forEach(s=>{const n=sideMode?9:20;for(let k=0;k<n;k++){
    const t=Math.max(.06,Math.pow((k+.3+R()*.6)/n,sideMode?1.5:1.8)),u=R(),type=u<.25?"pine":u<.6?"acacia":"round";
    if(sideMode){ // Bäume liegen in den Streifen links/rechts vom Spielfenster
      if(s>0&&t>.6)continue;                       // rechts unten steht der Wegweiser
      const r=Math.min(W*.085*(.04+t)+2,FL*.22),e=r*2.1,lo=s<0?e*.9:FR+e,hi=s<0?FL-e:W-e*.9;
      let x=(lo+hi)/2;for(let i=0;i<14;i++){x=hi>lo?lo+R()*(hi-lo):(lo+hi)/2;
        if(!trees.some(o=>Math.abs(o.x-x)<(o.r||8)+r&&Math.abs(o.t-t)<.3))break}
      trees.push({t,x,r,type,v:R()});
    }else trees.push({t,x:CX(t)+s*(HW(t)+W*(.03+R()*.12)*(.4+t)),type,v:R()});
  }});
  trees.sort((a,b)=>a.t-b.t);
  trees.forEach(T=>{
    const t=T.t,sc=.04+t,by=Math.round(Y(t)),k=Math.max(0,.78*(1-t)),f=c=>mixHex(c,HAZE,k),oc=mixHex(OUT,HAZE,k*.85),x=Math.round(T.x),seed=Math.floor(T.v*100),tp=TRUNK.map(f);
    if(T.type==="pine"){
      const w0=T.r?T.r*2.2:W*.13*sc+4,th=Math.round(H*.22*sc)+2,tw=Math.max(2,Math.round(W*.018*sc+1)),tiers=4,h=H*.2*sc+3,pal=["#1c4f35","#2b7442","#4a9f58","#7ccc72"].map(f);
      sprite(x-w0/2-3,by-th-h*tiers*.62-h-3,w0+6,th+h*tiers*.62+h+8,c=>{
        trunk(c,x,by,th,tw,tp,seed,0);
        for(let i=0;i<tiers;i++){const ty=by-th*.7-i*h*.62,w=w0*(1-i*.2);
          for(let r=0;r<=h;r++){const half=Math.max(0,Math.round(w/2*(r/h))),y=Math.round(ty-h+r);
            for(let xx=x-half;xx<=x+half;xx++){const rel=half?(xx-x)/half:0;let col=rel<-.4?pal[2]:rel<.15?pal[1]:pal[0];
              if(r<2)col=pal[3];else if(((xx+y)&1)&&Math.abs(rel+.4)<.12)col=pal[1];px(c,xx,y,col)}}}},oc);
    }else{
      const r=T.r||W*.085*sc+2,th=Math.round(H*(T.type==="acacia"?.5:.56)*sc),tw=Math.max(2,Math.round(W*.03*sc+2)),pal=GREEN[T.v<.5?0:1].map(f),flat=T.type==="acacia",ky=flat?.6:.88;
      sprite(x-r*2.7,by-th-r*1.4,r*5.4,th+r*1.4+5,c=>{
        const top=trunk(c,x,by,th,tw,tp,seed,tw*.12),cy=by-th,cxp=x+top;
        const pf=flat?[[0,0,1],[-1.1,.25,.8],[1.1,.2,.85],[-.5,-.4,.7],[.55,-.35,.7]]:[[0,0,1],[-.75,.4,.8],[.75,.4,.8],[-.45,-.55,.75],[.5,-.5,.7],[0,.65,.65]];
        const ds=pf.map(([a,b,q])=>[cxp+a*r,cy+b*r*ky,q*r,q*r*ky]);
        if(flat)ds.unshift([cxp+r*1.9,cy+r*.95,r*.55,r*.4]);   // kleiner Seitenbusch wie beim Vorbild
        blob(c,ds,pal,seed)},oc);
    }});

}

/* ===== Wegweiser als Pixel-Sprite ===== */
function drawSign(){
  const cvs=document.getElementById("signcv");cvs.width=52;cvs.height=58;const c=cvs.getContext("2d",{willReadFrequently:true});
  const MOSS=["#2f5f2a","#4c8a3a","#7dba52"];
  // Pfosten (verwittert)
  for(let y=21;y<=50;y++)for(let x=22;x<=27;x++){let col=x<24?"#a98150":x<26?"#86603a":"#58391c";const n=hs(x,y);
    if(n<.08)col="#cfa874";else if(n>.9)col="#3a2410";px(c,x,y,col)}
  // Brett (grauer, abgenutzt)
  for(let r=0;r<22;r++){const x0=1+Math.round(10*Math.abs(r-10.5)/10.5);
    for(let x=x0;x<=50;x++){let col=r<2?"#cfa468":r>=19?"#7d5c34":r>=17?"#94703f":"#b08752";
      if(r>=2&&r<17&&hs(x,r)<.1)col="#8f6b3c";if(x===x0&&r>1&&r<20)col="#cfa468";if(x===50)col="#7d5c34";px(c,x,r+1,col)}}
  // abgesplitterte Kanten
  [[14,1],[27,1],[40,1],[33,22],[20,22],[50,12],[50,16]].forEach(([x,y])=>c.clearRect(x,y,1,1));
  c.clearRect(8,1,2,1);c.clearRect(44,22,2,1);
  // Risse im Holz
  const crack=(x,y,n,dir)=>{for(let i=0;i<n;i++){px(c,x,y+i,"#3a220e");if(i%3===2)x+=dir}};
  crack(12,4,8,1);crack(46,7,9,-1);crack(26,19,4,1);crack(38,19,4,-1);crack(24,30,10,1);
  
  // Moos auf dem Brett (hängt von der Oberkante, sammelt sich unten rechts)
  for(let x=12;x<=26;x++){const h=1+Math.floor(hs(x,2)*3);for(let k=0;k<h;k++)px(c,x,2+k,MOSS[(k+x)%3===0?2:k?1:0])}
  for(let x=33;x<=43;x++){const h=Math.floor(hs(x,5)*3);for(let k=0;k<h;k++)px(c,x,2+k,MOSS[(k+x)%3===0?2:k?1:0])}
  for(let x=44;x<=49;x++){const h=1+Math.floor(hs(x,8)*2);for(let k=0;k<h;k++)px(c,x,22-k,MOSS[(k+x)%3===0?2:k?1:0])}
  for(let y=24;y<=34;y++)for(let x=22;x<=27;x++)if(hs(x,y)<.28-(y-24)*.02)px(c,x,y,MOSS[(x+y)%3===0?2:1]);
  [[47,5],[47,18]].forEach(([x,y])=>{rect(c,x,y,2,2,"#4a4f58");px(c,x,y,"#a0a6ae")});
  // Moos & Steine am Fuß
