<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OP-Rogue</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pirata+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1d33;--panel:#12304f;--ink:#f4ecd8;--dim:#9fb4c8;--gold:#f2b632;--red:#d9472b;--ok:#5fd18a;--line:#050d18;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1d33}}
:root[data-theme="dark"]{--bg:#0b1d33}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:linear-gradient(#0b1d33,#0e3a5c 70%,#145a7a);color:var(--ink);font-family:"Press Start 2P",ui-monospace,Menlo,monospace;font-size:12px;line-height:1.7;display:flex;justify-content:center;padding:16px}
main{width:100%;max-width:640px;padding-top:24px}
h1{font-family:"Pirata One","Press Start 2P",serif;font-weight:400;font-size:64px;letter-spacing:3px;color:var(--gold);text-shadow:4px 4px 0 var(--line);margin:0 0 8px;text-align:center;line-height:1.1}
.sub{color:var(--dim);text-align:center;font-size:10px;margin-bottom:24px}
.box{background:var(--panel);border:4px solid var(--ink);box-shadow:0 0 0 4px var(--line),6px 6px 0 4px var(--line);padding:20px;margin-bottom:20px}
.screen{display:none}.screen.on{display:block}
.typed{min-height:3.4em;font-size:13px}
input{width:100%;font:inherit;font-size:13px;padding:12px;background:var(--line);color:var(--ink);border:3px solid var(--dim);outline:none;margin:12px 0}
input:focus{border-color:var(--gold)}
button{font:inherit;font-size:12px;color:var(--line);background:var(--gold);border:0;padding:12px 16px;cursor:pointer;box-shadow:0 4px 0 #9a6f0a}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #9a6f0a}
button:disabled{background:#5b6b7a;box-shadow:none;cursor:not-allowed}
button.ghost{background:transparent;color:var(--dim);box-shadow:none;border:2px solid var(--dim)}
.msg{min-height:2.6em;font-size:10px;margin-top:4px}.err{color:var(--red)}.ok{color:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:16px 0}
.card{background:var(--line);border:3px solid var(--dim);padding:14px;cursor:pointer;text-align:left;color:var(--ink);box-shadow:none;font-size:10px;line-height:1.8}
.card.sel{border-color:var(--gold);background:#1a2f10}
.card h3{font-size:11px;margin:0 0 8px;color:var(--gold);line-height:1.5}
.tag{display:inline-block;background:var(--red);color:#fff;padding:2px 6px;margin-bottom:8px;font-size:9px}
.move{color:var(--ok)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.crew{color:var(--gold)}
</style>
</head>
<body>
<main>
<h1>OP-Rogue</h1>
<div class="sub">Ein One-Piece-Roguelike</div>

<section id="s-welcome" class="screen on box">
  <div class="typed" id="welcome"></div>
  <div class="row"><button id="btn-start" style="display:none">Weiter ▶</button></div>
</section>

<section id="s-name" class="screen box">
  <div>Wie lautet dein Name, Pirat?</div>
  <input id="name" maxlength="16" placeholder="Dein Piratenname" autocomplete="off" spellcheck="false">
  <div class="sub" style="text-align:left;margin:0">3–16 Zeichen: Buchstaben, Zahlen, _ und -</div>
  <div class="msg" id="name-msg"></div>
  <div class="row"><button id="btn-name">Bestätigen</button></div>
</section>

<section id="s-team" class="screen box">
  <div class="msg ok" style="font-size:11px" id="crew-title"></div>
  <div>Stelle dein Team für diese Runde zusammen:</div>
  <div class="grid" id="starters"></div>
  <div class="msg" id="team-msg"></div>
  <div class="row">
    <button id="btn-go" disabled>Segel setzen ⚓</button>
    <button id="btn-logout" class="ghost">Anderer Name</button>
  </div>
</section>

<section id="s-run" class="screen box">
  <div class="crew" id="run-title"></div>
  <p id="run-text"></p>
  <div class="row"><button id="btn-back">◀ Zurück zum Team</button></div>
</section>
</main>

<script>
const STARTERS=[
 {id:"ruffy",name:"Strohhut Ruffy",tag:"Teufelsfruchtnutzer",move:"Gum-Gum-Pistole"},
 {id:"zorro",name:"Roronoa Zorro",tag:"Schwertkämpfer",move:"Oni Giri"},
 {id:"sanji",name:"Schwarzfuß Sanji",tag:"Kämpfer",move:"Diable Jambe"}
];
const MAX_TEAM=3;
const $=id=>document.getElementById(id);
let db=null,user=null,uid=null,myName=null,team=new Set();

function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id))}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}

// Willkommensnachricht mit Tipp-Effekt
function typeText(el,text,done){
  let i=0;el.textContent="";
  const t=setInterval(()=>{el.textContent=text.slice(0,++i);if(i>=text.length){clearInterval(t);done&&done()}},45);
}

async function init(){
  try{db=await claude.use("db")}catch(e){db=null}
  try{user=await claude.use("user");uid=user?await user.id():null}catch(e){user=null}
  typeText($("welcome"),"Willkommen auf der Grandline!",()=>{$("btn-start").style.display="inline-block"});
}

$("btn-start").onclick=()=>{
  const saved=lsGet("op_name");
  if(saved){myName=saved;enterTeam()}else{show("s-name");$("name").focus()}
};

function valid(n){return /^[A-Za-z0-9_-]{3,16}$/.test(n)}

async function claimName(){
  const raw=$("name").value.trim(),msg=$("name-msg");
  msg.className="msg";
  if(!valid(raw)){msg.classList.add("err");msg.textContent="Ungültiger Name. Nutze 3–16 Zeichen: Buchstaben, Zahlen, _ oder -.";return}
  $("btn-name").disabled=true;msg.textContent="Prüfe Verfügbarkeit …";
  const key=raw.toLowerCase();
  try{
    if(!db)throw {code:"nodb"};
    const ref=db.doc("usernames/"+key);
    const snap=await ref.get();
    if(snap.exists&&snap.data().uid!==uid){
      msg.className="msg err";msg.textContent="Dieser Name ist leider schon vergeben. Bitte wähle einen anderen!";
      $("btn-name").disabled=false;$("name").select();return;
    }
    await ref.set({name:raw,uid:uid||null,created:Date.now()});
  }catch(e){
    msg.className="msg err";
    msg.textContent=e&&e.code==="nodb"
      ?"Die Datenbank ist hier nicht verfügbar (bitte angemeldet öffnen)."
      :"Speichern nicht möglich. Dir fehlt evtl. die Schreibberechtigung auf dieser Seite.";
    $("btn-name").disabled=false;return;
  }
  myName=raw;lsSet("op_name",raw);
  msg.className="msg ok";msg.textContent="Name gespeichert!";
  $("btn-name").disabled=false;
  setTimeout(enterTeam,600);
}
$("btn-name").onclick=claimName;
$("name").addEventListener("keydown",e=>{if(e.key==="Enter")claimName()});

function enterTeam(){
  team=new Set();
  $("crew-title").textContent="Die „"+myName+"“-Piratenbande ist gegründet!";
  renderStarters();show("s-team");
}

function renderStarters(){
  const g=$("starters");g.innerHTML="";
  STARTERS.forEach(s=>{
    const b=document.createElement("button");
    b.className="card"+(team.has(s.id)?" sel":"");
    b.innerHTML='<span class="tag"></span><h3></h3><div>Fähigkeit:</div><div class="move"></div>';
    b.querySelector(".tag").textContent=s.tag;
    b.querySelector("h3").textContent=s.name;
    b.querySelector(".move").textContent=s.move;
    b.onclick=()=>{
      if(team.has(s.id))team.delete(s.id);
      else if(team.size<MAX_TEAM)team.add(s.id);
      renderStarters();
    };
    g.appendChild(b);
  });
  $("team-msg").textContent="Team: "+team.size+" / "+MAX_TEAM+" gewählt";
  $("btn-go").disabled=team.size===0;
}

$("btn-go").onclick=()=>{
  const names=STARTERS.filter(s=>team.has(s.id)).map(s=>s.name).join(", ");
  $("run-title").textContent="Reise der „"+myName+"“-Bande";
  $("run-text").textContent="Crew an Bord: "+names+". Das erste Abenteuer wartet – hier folgen als Nächstes Kämpfe, Biome und Belohnungen!";
  show("s-run");
};
$("btn-back").onclick=()=>show("s-team");
$("btn-logout").onclick=()=>{lsDel("op_name");$("name").value="";$("name-msg").textContent="";show("s-name")};

init();
</script>
</body>
</html>
