<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Medieval Rogue</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Jacquard+24&family=MedievalSharp&display=swap" rel="stylesheet">
<style>
/* Ringbearer: Datei "ringbearer.medium.ttf" muss im selben Ordner wie diese HTML-Datei liegen */
@font-face{font-family:"Ringbearer";src:local("Ringbearer"),local("Ringbearer Medium"),url("ringbearer.medium.TTF") format("truetype");font-display:swap}
/* --u = Größe eines Pixels auf dem Bildschirm (wird per JS gesetzt), --us = Pixelgröße des Wegweisers */
:root{color-scheme:dark;--u:4px;--us:4px;--ink:#f1e6cf;--font:"Pixelify Sans",ui-monospace,monospace;--font-rb:"Ringbearer","MedievalSharp",Georgia,serif;
 --fw:min(64vw,calc(80vh*16/9));--ar:16/9;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f1e6cf}}
:root[data-theme="dark"]{--ink:#f1e6cf}
@media (max-width:760px){:root{--fw:94vw;--ar:4/3}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:#4a8d3c;color:var(--ink);font-family:var(--font)}
#bg{position:fixed;left:0;top:0;image-rendering:pixelated}
#frame{position:fixed;z-index:3;pointer-events:none;image-rendering:pixelated}
#title{position:fixed;left:0;top:0;z-index:4;pointer-events:none;overflow:visible}
#snd{position:fixed;z-index:6;left:calc(var(--u)*4);bottom:calc(var(--u)*4);padding:calc(var(--u)*1.5);cursor:pointer;
 background:#1d1812;border:0;border-radius:0;box-shadow:0 0 0 var(--u) #14100b,inset 0 0 0 var(--u) #5f5240}
#snd canvas{display:block;width:calc(var(--u)*15);height:calc(var(--u)*13);image-rendering:pixelated}

/* ===== Spielfenster (mittig, Pixel-Rahmen aus Stein) ===== */
.game{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:var(--fw);aspect-ratio:var(--ar);
 background:#1d1812;border-radius:0;
 box-shadow:calc(var(--u)*2) calc(var(--u)*2) 0 var(--u) rgba(0,0,0,.35);
 display:grid;place-items:center;text-align:center}
/* Ansichten im Spielfenster */
.view{display:none;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*3);padding:calc(var(--u)*8);width:100%;height:100%}
.view.on{display:flex}
.gtitle{font-family:"Jacquard 24","MedievalSharp",serif;font-weight:400;font-size:calc(var(--u)*14);line-height:1;letter-spacing:calc(var(--u)*.3);margin:0;color:#f0c85a;
 text-shadow:calc(var(--u)*.6) 0 0 #14100b,calc(var(--u)*-.6) 0 0 #14100b,0 calc(var(--u)*.6) 0 #14100b,0 calc(var(--u)*-.6) 0 #14100b,calc(var(--u)*1.2) calc(var(--u)*1.2) 0 rgba(0,0,0,.6)}
.gtitle.sm{font-size:calc(var(--u)*10)}
.gsub{margin:0;max-width:calc(var(--u)*150);color:#d9c9a6;font-family:var(--font-rb);font-size:calc(var(--u)*5);font-weight:400;letter-spacing:.02em;line-height:1.3}
.nameform{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*3);width:100%}
#name{width:min(calc(var(--u)*90),90%);font-family:var(--font-rb);font-weight:400;font-size:max(17px,calc(var(--u)*5.6));text-align:center;padding:calc(var(--u)*2);
 background:#0f0c08;color:var(--ink);border:0;border-radius:0;outline:0;caret-color:#f0c85a;box-shadow:0 0 0 var(--u) #14100b,inset 0 0 0 var(--u) #5f5240}
#name:focus{box-shadow:0 0 0 var(--u) #14100b,inset 0 0 0 var(--u) #f0c85a}
#name::placeholder{color:#7d705a}
.gbtn{font-family:var(--font-rb);font-weight:400;font-size:max(17px,calc(var(--u)*5.2));padding:calc(var(--u)*1.6) calc(var(--u)*5);background:#e8b84a;color:#2a1a0c;border:0;border-radius:0;cursor:pointer;
 box-shadow:inset 0 calc(var(--u)*-1.2) 0 #b8841f,0 0 0 var(--u) #14100b}
.gbtn:active{transform:translateY(var(--u))}
.gmsg{min-height:1.4em;margin:0;font-size:max(13px,calc(var(--u)*3.6));color:#ff8a72;font-weight:500}
@media (max-width:760px){.view{padding:calc(var(--u)*5) calc(var(--u)*4) calc(var(--u)*9);gap:calc(var(--u)*2.5)}.gtitle{font-size:calc(var(--u)*10)}.gtitle.sm{font-size:calc(var(--u)*8)}.gsub{font-size:calc(var(--u)*4.8)}}
.glink{background:none;border:0;color:#b9ab8d;font-family:var(--font);font-size:max(14px,calc(var(--u)*3.6));cursor:pointer;text-decoration:underline}

/* ===== Wegweiser (neben dem Fenster, rechts unten) ===== */
.sign{position:fixed;z-index:5;left:0;top:0;width:calc(var(--us)*52);height:calc(var(--us)*44);transform:rotate(-10deg);transform-origin:50% 100%;
 filter:drop-shadow(var(--us) var(--us) 0 rgba(0,0,0,.3))}
.sign canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.signtxt{position:absolute;left:calc(var(--us)*13);top:calc(var(--us)*2);width:calc(var(--us)*32);height:calc(var(--us)*20);
 display:flex;align-items:center;justify-content:center;text-align:center;
 font-weight:700;font-size:calc(var(--us)*5.2);line-height:1.1;color:#2a1a0c;text-shadow:0 calc(var(--us)*.5) 0 rgba(255,225,170,.45)}
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div class="game" id="game">
  <div class="view" id="v-name">
    <h1 class="gtitle">Willkommen Sire!</h1>
    <p class="gsub">Nennt euren Namen, auf das er in die Chroniken eingehe!</p>
    <div class="nameform">
      <input id="name" type="text" maxlength="16" placeholder="Euer Name" autocomplete="off" spellcheck="false" aria-label="Euer Name">
      <p class="gmsg" id="name-msg"></p>
      <button class="gbtn" id="btn-name">Zur Schlacht!</button>
    </div>
  </div>
  <div class="view" id="v-greet">
    <h2 class="gtitle sm" id="greet-title"></h2>
    <p class="gsub">Euer Name steht nun in den Chroniken. Das Menü folgt in Kürze.</p>
    <button class="glink" id="btn-rename">Anderen Namen wählen</button>
  </div>
</div>
<canvas id="frame"></canvas>
<svg id="title" aria-label="Medieval Rogue"></svg>
<audio id="bgm" src="kiravale-medieval-music-593694.mp3" loop preload="auto"></audio>
<button id="snd" aria-label="Musik an/aus"><canvas id="sndcv"></canvas></button>

<div class="sign" id="sign">
  <canvas id="signcv"></canvas>
  <div class="signtxt">Auf in die<br>Schlacht</div>
</div>

<script>
/* ===== Pixel-Helfer: alles wird in niedriger Auflösung gezeichnet und per CSS vergrößert ===== */
const cv=document.getElementById("bg"),M=cv.getContext("2d");
const OUT="#1a1f16",HAZE="#dcefc8";
const hexRGB=c=>[1,3,5].map(i=>parseInt(c.substr(i,2),16));
const mixHex=(a,b,k)=>{const A=hexRGB(a),B=hexRGB(b);return"#"+A.map((v,i)=>Math.round(v+(B[i]-v)*k).toString(16).padStart(2,"0")).join("")};
const rng=s=>()=>(s=(s*16807)%2147483647)/2147483647;
const hs=(x,y)=>{let h=Math.imul(x|0,73856093)^Math.imul(y|0,19349663);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)%1000/1000};
const px=(c,x,y,col)=>{c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),1,1)};
const rect=(c,x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))};
function disc(c,x,y,rx,ry,col,dith){x=Math.round(x);y=Math.round(y);ry=Math.max(ry,.5);
  for(let dy=-Math.round(ry);dy<=Math.round(ry);dy++){const half=Math.round(rx*Math.sqrt(Math.max(0,1-dy*dy/(ry*ry+.01))));
    for(let dx=-half;dx<=half;dx++)if(!dith||((x+dx+y+dy)&1)==0)px(c,x+dx,y+dy,col)}}
// dunkle Kontur um alle gefüllten Pixel (wie beim Baum-Vorbild)
function outline(c,w,h,col){const d=c.getImageData(0,0,w,h),a=d.data,o=new Uint8ClampedArray(a),[r,g,b]=hexRGB(col);
  const op=(x,y)=>x>=0&&y>=0&&x<w&&y<h&&a[(y*w+x)*4+3]>0;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;
    if(a[i+3]===0&&(op(x-1,y)||op(x+1,y)||op(x,y-1)||op(x,y+1))){o[i]=r;o[i+1]=g;o[i+2]=b;o[i+3]=255}}
  d.data.set(o);c.putImageData(d,0,0)}
function sprite(ox,oy,w,h,draw,oc){ox=Math.round(ox);oy=Math.round(oy);w=Math.max(3,Math.ceil(w));h=Math.max(3,Math.ceil(h));
  const t=document.createElement("canvas");t.width=w;t.height=h;const c=t.getContext("2d",{willReadFrequently:true});
  c.translate(-ox,-oy);draw(c);c.setTransform(1,0,0,1,0,0);outline(c,w,h,oc||OUT);M.drawImage(t,ox,oy)}
// Farbverlauf in Stufen mit Raster-Dithering (typisch Pixelart)
const BAY=[[0,.5],[.75,.25]];
const band=(pal,f,x,y)=>{const v=Math.max(0,Math.min(1,f))*(pal.length-1),i=Math.min(pal.length-2,Math.floor(v));return pal[i+(v-i>BAY[y&1][x&1]?1:0)]};
// Kugel/Blatthaufen mit 4 Farbtönen: Licht von oben links
function blob(c,ds,pal,seed){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  ds.forEach(([x,y,rx,ry])=>{x0=Math.min(x0,x-rx);x1=Math.max(x1,x+rx);y0=Math.min(y0,y-ry);y1=Math.max(y1,y+ry)});
  for(let y=Math.floor(y0);y<=Math.ceil(y1);y++)for(let x=Math.floor(x0);x<=Math.ceil(x1);x++){
    let hit=null;for(const d of ds){const nx=(x-d[0])/(d[2]+.4),ny=(y-d[1])/(d[3]+.4);if(Math.pow(Math.abs(nx),3)+Math.pow(Math.abs(ny),3)<=1)hit=[nx,ny]}
    if(!hit)continue;
    const l=-(hit[0]*.5+hit[1]*.85)+((x+y)&1?.06:-.06)+(hs(x+seed,y)<.12?.22:0);
    px(c,x,y,l>.5?pal[3]:l>.12?pal[2]:l>-.35?pal[1]:pal[0])}}
const GREEN=[["#235d2f","#35903b","#5cb949","#92d65c"],["#285a2c","#3f8a35","#6bb046","#a4da60"]];
const TRUNK=["#3f2512","#6e4224","#a0653a","#d6a068"];
function trunk(c,x,by,th,tw,pal,seed,bend){
  for(let i=0;i<=th;i++){const y=by-i,f=i/th,w=Math.max(2,Math.round(tw*(1+(1-f)*.45))),off=Math.round(Math.sin(i*.09+seed)*bend*f),x0=x-Math.floor(w/2)+off;
    for(let j=0;j<w;j++){const r=j/(w-1||1);let col=r<.3?pal[2]:r<.72?pal[1]:pal[0];
      const n=hs(x0+j,y+seed);if(n<.07)col=pal[3];else if(n>.95)col=pal[0];px(c,x0+j,y,col)}}
  return Math.round(Math.sin(th*.09+seed)*bend)}

/* ===== Waldszene ===== */
let W=0,H=0,S=4;
function layout(){const vw=innerWidth,vh=innerHeight;
  S=Math.max(2,Math.round(Math.min(vh/190,vw/150)));
  const rs=document.documentElement.style;rs.setProperty("--u",S+"px");
  const mob=vw<=760,fw=mob?vw*.94:Math.min(vw*.64,vh*.8*16/9),fh=mob?fw*.75:fw*9/16;
  const below=vh/2-fh/2,us=Math.max(1,Math.min(S,mob?Math.floor(vw*.46/52):Math.floor((vw-fw)/2/40),Math.floor(below/35)));
  rs.setProperty("--us",us+"px");
  // Wegweiser: schräg an die rechte untere Fensterecke gelehnt, das Brett ragt leicht ins Fenster
  const fwR=Math.max(S*40,Math.round(fw/S)*S),fhR=Math.round(fh/S)*S,gl=Math.round((vw-fwR)/2),gt=Math.round((vh-fhR)/2),ex=gl+fwR,ey=gt+fhR,bx=Math.min(ex+8*us,vw-6-26*us),by=ey+2*us,Px=bx+5.56*us,Py=by+31.5*us,sg=document.getElementById("sign");
  if(sg){sg.style.left=(Px-26*us)+"px";sg.style.top=(Py-44*us)+"px"}
  const g=document.getElementById("game"),fc=document.getElementById("frame");
  Object.assign(g.style,{left:gl+"px",top:gt+"px",width:fwR+"px",height:fhR+"px",transform:"none",aspectRatio:"auto"});
  Object.assign(fc.style,{left:(gl-S)+"px",top:(gt-S)+"px",width:(fwR+2*S)+"px",height:(fhR+2*S)+"px"});
  FRM={gl,gt,fwR,fhR};drawFrame(fwR/S+2,fhR/S+2);drawTitle()}

/* ===== Titel: kleiner Bogen über dem Fenster, Anfang und Ende ragen in den Steinrahmen ===== */
let FRM=null;
function drawTitle(){
  if(!FRM)return;const svg=document.getElementById("title"),NS="http://www.w3.org/2000/svg",u=S,TXT="Medieval Rogue";
  svg.innerHTML="";svg.setAttribute("width",innerWidth);svg.setAttribute("height",innerHeight);
  const mk=fs=>{const e=document.createElementNS(NS,"text");e.setAttribute("font-size",fs);e.setAttribute("letter-spacing",fs*.03);
    e.setAttribute("font-family","'Jacquard 24','MedievalSharp',serif");return e};
  const probe=mk(20*u);probe.textContent=TXT;svg.appendChild(probe);const L0=probe.getComputedTextLength()||120*u;svg.removeChild(probe);
  // Schriftgröße so wählen, dass der Titel ca. 60 % der Fensterbreite einnimmt (Handy: 80 %)
  const target=FRM.fwR*(innerWidth<=760?.8:.6),fs=Math.max(8*u,Math.min(32*u,20*u*target/L0)),Lw=L0*fs/(20*u);
  const sag=Lw*.085;let c=Lw;for(let i=0;i<4;i++)c=Lw/(1+8/3*Math.pow(sag/c,2));
  const rad=(c*c/4+sag*sag)/(2*sag),mx=FRM.gl+FRM.fwR/2,ye=FRM.gt+3*u;
  const path=document.createElementNS(NS,"path");path.setAttribute("id","tarc");path.setAttribute("fill","none");
  path.setAttribute("d","M"+(mx-c/2)+" "+ye+" A"+rad+" "+rad+" 0 0 1 "+(mx+c/2)+" "+ye);svg.appendChild(path);
  [[u,"rgba(0,0,0,.5)","rgba(0,0,0,.5)"],[0,"#f0c85a","#14100b"]].forEach(([off,fill,stroke])=>{
    const t=mk(fs);t.setAttribute("fill",fill);t.setAttribute("stroke",stroke);t.setAttribute("stroke-width",u*1.6);
    t.setAttribute("stroke-linejoin","miter");t.style.paintOrder="stroke";if(off)t.setAttribute("transform","translate("+off+","+off+")");
    const tp=document.createElementNS(NS,"textPath");tp.setAttribute("href","#tarc");tp.setAttribute("startOffset","50%");
    tp.setAttribute("text-anchor","middle");tp.textContent=TXT;t.appendChild(tp);svg.appendChild(t)})}

/* ===== Spielfenster-Rahmen: Steine einer Burgmauer mit Rissen und Moos ===== */
function drawFrame(w,h){
  const fc=document.getElementById("frame");fc.width=w;fc.height=h;const c=fc.getContext("2d"),R=rng(5);
  const id=new Int16Array(w*h).fill(-1),at=(x,y)=>x<0||y<0||x>=w||y>=h?-1:id[y*w+x];
  let nid=0;
  // eine Steinreihe: Blöcke 6–11 px lang, dazwischen 1 px Fuge
  const run=(fx,len,vert)=>{let p=len[0];
    while(p<=len[1]){const L=Math.max(1,Math.min(len[1]-p+1,6+Math.floor(R()*6))),b=nid++;
      for(let a=0;a<L;a++)for(let t=fx[0];t<=fx[1];t++)id[(vert?p+a:t)*w+(vert?t:p+a)]=b;
      p+=L;if(p<=len[1]){for(let t=fx[0];t<=fx[1];t++)id[(vert?p:t)*w+(vert?t:p)]=-2;p++}}};
  run([1,4],[1,w-2],false);run([h-5,h-2],[1,w-2],false);run([1,4],[5,h-6],true);run([w-5,w-2],[5,h-6],true);
  const T=[["#6e6558","#8c806d","#ab9d86"],["#756a5b","#948874","#b3a58e"],["#665e52","#857966","#a49680"]];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const v=id[y*w+x];
    if(v===-2)px(c,x,y,"#2f2820");
    else if(v>=0){const lo=at(x,y+1)!==v||at(x+1,y)!==v,hi=at(x,y-1)!==v||at(x-1,y)!==v;let k=lo?0:hi?2:1;const n=hs(x,y);
      if(n<.07)k=Math.max(0,k-1);else if(n>.95)k=Math.min(2,k+1);px(c,x,y,T[v%3][k])}
    else if(Math.min(x,y,w-1-x,h-1-y)===0||(x>=5&&x<=w-6&&y>=5&&y<=h-6&&(x===5||x===w-6||y===5||y===h-6)))px(c,x,y,"#14100b")}
  // Risse quer durch die Steinreihe
  for(let k=0;k<10;k++){const side=Math.floor(R()*4);
    if(side<2){let x=8+Math.floor(R()*(w-16));const y0=side?h-5:1;for(let j=0;j<4;j++){if(at(x,y0+j)>=0)px(c,x,y0+j,"#241d16");x+=Math.floor(R()*3)-1}}
    else{let y=8+Math.floor(R()*(h-16));const x0=side===3?w-5:1;for(let j=0;j<4;j++){if(at(x0+j,y)>=0)px(c,x0+j,y,"#241d16");y+=Math.floor(R()*3)-1}}}
  // Moos
  const MO=["#2f5f2a","#4c8a3a","#7dba52"];
  for(let k=0;k<18;k++){const side=Math.floor(R()*4),n=3+Math.floor(R()*6),pos=6+Math.floor(R()*((side<2?w:h)-14));
    for(let a=0;a<n;a++){const hg=1+(hs(a,k)<.5?1:0);
      for(let t=0;t<hg;t++){const x=side<2?pos+a:(side===2?1+t:w-5+t),y=side<2?(side?h-5+t:1+t):pos+a;
        if(at(x,y)!==-1)px(c,x,y,t?MO[0]:MO[(a+k)%3===0?2:1])}}}}

function drawForest(){
  layout();W=Math.ceil(innerWidth/S);H=Math.ceil(innerHeight/S);
  cv.width=W;cv.height=H;cv.style.width=W*S+"px";cv.style.height=H*S+"px";
  const R=rng(11),vy=Math.round(H*.26),vw=innerWidth,vh=innerHeight,fwPx=vw<=760?vw*.94:Math.min(vw*.64,vh*.8*16/9),FL=(vw-fwPx)/2/S,FR=W-FL,sideMode=FL>=28;
  const Y=t=>vy+(H-vy)*t,HW=t=>W*(.01+.2*t),CX=t=>W/2+Math.sin(t*3.2+.8)*W*.025*(1-t*.5);
  const SKY=["#3d96e0","#5fb0ec","#8ac8f2","#b5dff6","#dff0fa"],GRD=["#c9e08a","#a6d06d","#82bb58","#62a447","#4a8d3c","#387632","#2b6029"];
  const SAND=["#ecdcae","#dcc58b","#cdae6f","#bd9559","#a97f45"];

  // Blätterdach/Himmel + Waldboden (gestuft, gerastert)
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)px(M,x,y,y<vy?band(SKY,y/vy,x,y):band(GRD,(y-vy)/(H-vy),x,y));
  // ferne Baumreihe am Horizont
  [["#a9d57a",.7],["#8cc866",1]].forEach(([col,s],j)=>{for(let x=-4;x<W+6;x+=2+Math.floor(R()*4)){
    disc(M,x,vy-1-j*2+Math.round(R()*2),3+R()*5*s,2+R()*3*s,col)}});
  // Pixel-Wolken
  const cloud=(x,y,s)=>{const P=[[0,0,1],[1.1,.2,.8],[-1.1,.25,.75],[.5,-.5,.7]];
    P.forEach(([a,b,q])=>disc(M,x+a*s,y+b*s*.6+Math.max(1,s*.28),q*s,q*s*.55,"#bcd9f0"));
    P.forEach(([a,b,q])=>disc(M,x+a*s,y+b*s*.6,q*s,q*s*.55,"#ffffff"))};
  [[.12,.1,7],[.34,.2,5],[.62,.08,8],[.86,.2,6],[.5,.3,4]].forEach(([a,b,sz])=>cloud(W*a,vy*b+3,Math.max(3,sz*W/360)));

  // ===== Sandweg =====
  const L=[],Rg=[];
  for(let y=vy;y<H;y++){
    const t=(y-vy)/(H-vy),c0=Math.round(CX(t)),hw=Math.max(1,Math.round(HW(t))+Math.round((hs(y,3)-.5)*1.8)),l=c0-hw,r=c0+hw;L[y]=l;Rg[y]=r;
    for(let x=l;x<=r;x++){let col=band(SAND,t,x,y);const n=hs(x,y);
      if(n<.05)col="#f0e0b4";else if(n>.95)col="#a2773f";
      if(x===l||x===r)col="#6e4a26";else if(x===r-1&&t>.15)col="#a97f45";
      px(M,x,y,col)}}
  for(let i=0;i<110;i++){const t=Math.pow(R(),.8),y=Math.round(Y(t));if(y<vy||y>=H)continue;
    const w=2+Math.floor(t*6),x=Math.round(CX(t)+(R()*2-1)*HW(t)*.8);for(let k=0;k<w;k++)if(x+k>L[y]+1&&x+k<Rg[y]-1)px(M,x+k,y,"#b48b50")}

  // Moosflecken auf dem Weg
  for(let i=0;i<55;i++){const t=Math.pow(R(),.8),y=Math.round(Y(t));if(y<vy+2||y>=H)continue;
    const x=Math.round(CX(t)+(R()*2-1)*HW(t)*.85),n=2+Math.floor(R()*4);
    for(let k=0;k<n;k++){const xx=x+Math.floor(R()*3*(.4+t*2)),yy=y+(R()<.3?1:0);if(xx>L[y]&&xx<Rg[y])px(M,xx,yy,R()<.5?"#4c9a3c":"#7fc455")}}
  // Steine als graue Punkte, teils bemoost
  const stones=[];for(let i=0,n=Math.round(110*Math.min(1,W/360)+25);i<n;i++){const t=Math.pow(R(),.75);stones.push({t,x:CX(t)+(R()*2-1)*HW(t)*.88,r:R(),m:R()<.4})}
  stones.sort((a,b)=>a.t-b.t);
  stones.forEach(s=>{
    const x=Math.round(s.x),y=Math.round(Y(s.t)),rx=1+Math.floor(s.t*2.4+s.r*.9),ry=Math.max(1,Math.round(rx*.6)),k=(1-s.t)*.5;
    if(y<vy+2||y>=H)return;
    const gp=["#4b515b","#7b818c","#a8adb6","#d2d6dc"].map(c=>mixHex(c,HAZE,k)),mp=["#2d6a30","#4c9a3c","#80c657"].map(c=>mixHex(c,HAZE,k));
    rect(M,x-rx+1,y+ry+1,rx*2-1,1,"#a07a45");
    if(rx<=1){px(M,x,y,gp[1]);px(M,x-1,y,gp[2]);if(s.m)px(M,x-1,y,mp[1]);return}
    sprite(x-rx-2,y-ry-2,rx*2+5,ry*2+5,c=>{
      for(let yy=-ry;yy<=ry;yy++)for(let xx=-rx;xx<=rx;xx++){const nx=xx/(rx+.3),ny=yy/(ry+.3);if(nx*nx+ny*ny>1)continue;
        const l=-(nx*.5+ny*.8);let col=l>.45?gp[3]:l>.05?gp[2]:l>-.4?gp[1]:gp[0];
        if(s.m&&ny<-.1+(hs(x+xx,y+yy)-.5)*.7)col=l>.2?mp[2]:l>-.3?mp[1]:mp[0];
        px(c,x+xx,y+yy,col)}},mixHex("#2a2c33",HAZE,k*.8))});

  // Gras am Wegrand + Büschel + Blümchen
  const tuft=(x,y,h,k)=>{const cs=["#2f7a35","#4aa83a","#7fcb52"].map(c=>mixHex(c,HAZE,k));
    for(let j=-1;j<=1;j++){const hh=Math.max(1,h-Math.abs(j)+(hs(x+j,y)<.4?1:0));for(let q=0;q<hh;q++)px(M,x+j,y-q,cs[(q+j+3)%3===0?2:q?1:0])}};
  for(let i=0;i<170;i++){const t=Math.pow(R(),.8),y=Math.round(Y(t));if(y<vy+2||y>=H)continue;
    const s=R()<.5?-1:1;tuft(s<0?L[y]:Rg[y],y,2+Math.floor(t*4),(1-t)*.5)}
  for(let i=0;i<420;i++){const t=Math.pow(R(),.8),x=Math.floor(R()*W),y=Math.round(Y(t));if(y<vy+2||y>=H)continue;
    if(x>L[y]-3&&x<Rg[y]+3)continue;tuft(x,y,1+Math.floor(t*3),(1-t)*.5)}
  for(let i=0;i<70;i++){const t=Math.pow(R(),.9),x=Math.floor(R()*W),y=Math.round(Y(t));if(y<vy+2||y>=H)continue;
    if(x>L[y]-3&&x<Rg[y]+3)continue;const c=R()<.6?"#ffe66d":"#ffffff";
    px(M,x,y,c);if(t>.35){px(M,x-1,y,"#fff");px(M,x+1,y,"#fff");px(M,x,y-1,"#fff");px(M,x,y,"#ffe66d")}}

  // ===== Bäume von fern nach nah =====
  const trees=[];
  [-1,1].forEach(s=>{const n=sideMode?8:20;for(let k=0;k<n;k++){
    const t=Math.max(.06,Math.pow((k+.3+R()*.6)/n,sideMode?1:1.8)),u=R(),type=u<.25?"pine":u<.6?"acacia":"round";
    if(sideMode){ // locker verteilt links und rechts vom Spielfenster, auch nebeneinander
      const cap=FL*.17,r=cap*(.4+.6*t)*(.85+R()*.3),e=r*2.3,cornerY=(vh/2+fwPx*9/32)/S,lo=s<0?e*.9:FR+e,hi=s<0?FL-e:W-e*.9;
      let x=(lo+hi)/2;
      for(let i=0;i<20;i++){x=hi>lo?lo+R()*(hi-lo):(lo+hi)/2;
        const blocked=s>0&&Y(t)>cornerY-14&&x<FR+40;           // nicht hinter den Wegweiser stellen
        if(!blocked&&!trees.some(o=>Math.abs(o.x-x)<(o.r+r)*.9&&Math.abs(o.t-t)<.14))break}
      trees.push({t,x,r,type,v:R()});
    }else trees.push({t,x:CX(t)+s*(HW(t)+W*(.03+R()*.12)*(.4+t)),type,v:R()});
  }});
  if(sideMode)[[-1,.55],[1,.42]].forEach(([s,t])=>{   // zwei zusätzliche Bäume
    const cap=FL*.17,r=cap*(.4+.6*t)*(.85+R()*.3),e=r*2.3,lo=s<0?e*.9:FR+e,hi=s<0?FL-e:W-e*.9,type=R()<.5?"acacia":"round";
    let x=(lo+hi)/2;for(let i=0;i<30;i++){x=hi>lo?lo+R()*(hi-lo):(lo+hi)/2;
      if(!trees.some(o=>Math.abs(o.x-x)<(o.r+r)*.9&&Math.abs(o.t-t)<.14))break}
    trees.push({t,x,r,type,v:R()})});
  trees.sort((a,b)=>a.t-b.t);
  trees.forEach(T=>{
    const t=T.t,sc=.04+t,by=Math.round(Y(t)),k=Math.max(0,(T.r?.4:.78)*(1-t)),f=c=>mixHex(c,HAZE,k),oc=mixHex(OUT,HAZE,k*.85),x=Math.round(T.x),seed=Math.floor(T.v*100),tp=TRUNK.map(f);
    if(T.type==="pine"){
      const w0=T.r?T.r*2.4:W*.13*sc+4,th=T.r?Math.round(T.r*1.1)+2:Math.round(H*.22*sc)+2,tw=Math.max(2,T.r?Math.round(T.r*.3):Math.round(W*.018*sc+1)),tiers=4,h=T.r?T.r*1.1+3:H*.2*sc+3,pal=["#1c4f35","#2b7442","#4a9f58","#7ccc72"].map(f);
      sprite(x-w0/2-3,by-th-h*tiers*.62-h-3,w0+6,th+h*tiers*.62+h+8,c=>{
        trunk(c,x,by,th,tw,tp,seed,0);
        for(let i=0;i<tiers;i++){const ty=by-th*.7-i*h*.62,w=w0*(1-i*.2);
          for(let r=0;r<=h;r++){const half=Math.max(0,Math.round(w/2*(r/h))),y=Math.round(ty-h+r);
            for(let xx=x-half;xx<=x+half;xx++){const rel=half?(xx-x)/half:0;let col=rel<-.4?pal[2]:rel<.15?pal[1]:pal[0];
              if(r<2)col=pal[3];else if(((xx+y)&1)&&Math.abs(rel+.4)<.12)col=pal[1];px(c,xx,y,col)}}}},oc);
    }else{
      const r=T.r||W*.085*sc+2,th=T.r?Math.round(r*(T.type==="acacia"?2.4:2)):Math.round(H*(T.type==="acacia"?.5:.56)*sc),tw=T.r?Math.max(2,Math.round(r*.4)):Math.max(2,Math.round(W*.03*sc+2)),pal=GREEN[T.v<.5?0:1].map(f),flat=T.type==="acacia",ky=flat?.6:.88;
      sprite(x-r*2.7,by-th-r*1.4,r*5.4,th+r*1.4+5,c=>{
        const top=trunk(c,x,by,th,tw,tp,seed,tw*.12),cy=by-th,cxp=x+top;
        const pf=flat?[[0,0,1],[-1.1,.25,.8],[1.1,.2,.85],[-.5,-.4,.7],[.55,-.35,.7],[-1.6,.5,.55],[1.6,.45,.55],[0,.5,.8]]:[[0,0,1],[-.75,.4,.8],[.75,.4,.8],[-.45,-.55,.75],[.5,-.5,.7],[0,.65,.65],[-1.2,.5,.6],[1.2,.5,.6],[-.2,-.9,.55]];
        const ds=pf.map(([a,b,q])=>[cxp+a*r,cy+b*r*ky,q*r,q*r*ky]);
        if(flat)ds.unshift([cxp+r*1.9,cy+r*.95,r*.55,r*.4]);   // kleiner Seitenbusch wie beim Vorbild
        blob(c,ds,pal,seed)},oc);
    }});

}

/* ===== Wegweiser als Pixel-Sprite ===== */
function drawSign(){
  const cvs=document.getElementById("signcv");cvs.width=52;cvs.height=44;const c=cvs.getContext("2d",{willReadFrequently:true});
  const MOSS=["#2f5f2a","#4c8a3a","#7dba52"];
  // Pfosten (verwittert)
  for(let y=21;y<=36;y++)for(let x=22;x<=27;x++){let col=x<24?"#a98150":x<26?"#86603a":"#58391c";const n=hs(x,y);
    if(n<.08)col="#cfa874";else if(n>.9)col="#3a2410";px(c,x,y,col)}
  // Brett (grauer, abgenutzt)
  for(let r=0;r<22;r++){const x0=1+Math.round(10*Math.abs(r-10.5)/10.5);
    for(let x=x0;x<=50;x++){let col=r<2?"#cfa468":r>=19?"#7d5c34":r>=17?"#94703f":"#b08752";
      if(r>=2&&r<17&&hs(x,r)<.1)col="#8f6b3c";if(x===x0&&r>1&&r<20)col="#cfa468";if(x===50)col="#7d5c34";px(c,x,r+1,col)}}
  // abgesplitterte Kanten
  [[14,1],[27,1],[40,1],[33,22],[20,22],[50,12],[50,16]].forEach(([x,y])=>c.clearRect(x,y,1,1));
  c.clearRect(8,1,2,1);c.clearRect(44,22,2,1);
  // Risse im Holz
  const crack=(x,y,n,dir)=>{for(let i=0;i<n;i++){px(c,x,y+i,"#3a220e");if(i%3===2)x+=dir}};
  crack(12,4,8,1);crack(46,7,9,-1);crack(26,19,4,1);crack(38,19,4,-1);crack(24,25,8,1);
  
  // Moos auf dem Brett (hängt von der Oberkante, sammelt sich unten rechts)
  for(let x=12;x<=26;x++){const h=1+Math.floor(hs(x,2)*3);for(let k=0;k<h;k++)px(c,x,2+k,MOSS[(k+x)%3===0?2:k?1:0])}
  for(let x=33;x<=43;x++){const h=Math.floor(hs(x,5)*3);for(let k=0;k<h;k++)px(c,x,2+k,MOSS[(k+x)%3===0?2:k?1:0])}
  for(let x=44;x<=49;x++){const h=1+Math.floor(hs(x,8)*2);for(let k=0;k<h;k++)px(c,x,22-k,MOSS[(k+x)%3===0?2:k?1:0])}
  for(let y=24;y<=34;y++)for(let x=22;x<=27;x++)if(hs(x,y)<.28-(y-24)*.02)px(c,x,y,MOSS[(x+y)%3===0?2:1]);
  [[47,5],[47,18]].forEach(([x,y])=>{rect(c,x,y,2,2,"#4a4f58");px(c,x,y,"#a0a6ae")});
  // Moos & Steine am Fuß
  disc(c,25,38,10,3,"#2f6a2f");disc(c,24,37,9,2,"#4c9a3c");
  for(let i=0;i<8;i++)px(c,16+Math.floor(hs(i,9)*18),36+Math.floor(hs(i,4)*2),"#80c657");
  [17,19,31,33].forEach((x,i)=>rect(c,x,34-(i%2),1,3+(i%2),i%2?"#4c9a3c":"#7fc455"));
  [[14,38],[34,38]].forEach(([x,y])=>{rect(c,x,y,3,2,"#7b818c");px(c,x,y,"#a8adb6")});
  outline(c,52,44,"#1a0f08")}

/* ===== Namenswahl ===== */
const gid=id=>document.getElementById(id);
let playerName=null;try{playerName=localStorage.getItem("mr_name")}catch(e){}
function showView(v){["v-name","v-greet"].forEach(id=>gid(id).classList.toggle("on",id===v))}
function openGreeting(){gid("greet-title").textContent="Seid gegrüßt, "+playerName+"!";showView("v-greet")}
function openNameForm(){gid("name").value=playerName||"";gid("name-msg").textContent="";showView("v-name");if(innerWidth>760)gid("name").focus()}
function confirmName(){
  const n=gid("name").value.trim().replace(/\s+/g," "),msg=gid("name-msg");
  if(!/^[\p{L}0-9 _'-]{3,16}$/u.test(n)){msg.textContent="Ein Name braucht 3 bis 16 Zeichen: Buchstaben, Zahlen, Leerzeichen, _ ' oder -";return}
  playerName=n;try{localStorage.setItem("mr_name",n)}catch(e){}
  openGreeting()}
gid("btn-name").onclick=confirmName;
gid("name").addEventListener("keydown",e=>{if(e.key==="Enter")confirmName()});
gid("btn-rename").onclick=openNameForm;
playerName?openGreeting():openNameForm();

/* ===== Hintergrundmusik: läuft in Dauerschleife, sobald der Browser Ton erlaubt ===== */
const bgm=document.getElementById("bgm");bgm.volume=.1;
let muted=false;try{muted=localStorage.getItem("mr_muted")==="1"}catch(e){}
bgm.muted=muted;
const EVT=["pointerdown","keydown","touchstart"];
function startMusic(){bgm.play().then(()=>EVT.forEach(e=>removeEventListener(e,startMusic))).catch(()=>{})}
EVT.forEach(e=>addEventListener(e,startMusic));startMusic();   // Autoplay klappt nur, wenn der Browser es erlaubt, sonst startet die Musik beim ersten Klick
function drawSnd(){
  const cv=document.getElementById("sndcv");cv.width=15;cv.height=13;const c=cv.getContext("2d",{willReadFrequently:true}),G="#f0c85a";
  rect(c,2,5,3,4,G);rect(c,5,4,1,6,G);rect(c,6,3,1,8,G);
  if(muted){[[9,4],[10,5],[11,6],[12,7],[13,8],[13,4],[12,5],[10,7],[9,8]].forEach(([x,y])=>px(c,x,y,"#e04b3a"))}
  else{rect(c,8,5,1,4,G);rect(c,10,3,1,8,G)}
  outline(c,15,13,"#14100b")}
document.getElementById("snd").onclick=()=>{muted=!muted;bgm.muted=muted;try{localStorage.setItem("mr_muted",muted?"1":"0")}catch(e){}
  drawSnd();if(bgm.paused)bgm.play().catch(()=>{})};
drawSnd();

addEventListener("resize",drawForest);drawForest();drawSign();
if(document.fonts){document.fonts.load("40px 'Jacquard 24'").then(drawTitle).catch(()=>{});document.fonts.ready.then(drawTitle)}
